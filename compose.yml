services:

  la-pince-db:
    image: postgres:15
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: projet_la_pince_db
    volumes:
      - pgdata:/var/lib/postgresql/data 
    networks: [la-pince-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  la-pince-cache:
    image: valkey/valkey:latest 
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    networks: [la-pince-net]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  la-pince-adminer:
    image: adminer:latest
    restart: always
    ports:
      - "8080:8080"
    networks: [la-pince-net]
    depends_on:
      la-pince-db:
        condition: service_healthy

  mail:
    image: mailhog/mailhog
    restart: always
    ports:
      - "1025:1025"  
      - "8025:8025"  

  la-pince-backend:
    build:
      context: ./apps/la-pince-back
      dockerfile: Dockerfile
    ports:
      - "3333:3333"
    env_file:
      - .env
    tty: true
    networks: [la-pince-net]
    depends_on:
      - la-pince-db
      - la-pince-cache
    volumes:
      - ./apps/la-pince-back:/usr/src/app
      - /usr/src/app/node_modules

  la-pince-front:
    build:
      context: ./apps/la-pince-front
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - la-pince-backend
    networks: [la-pince-net]
    volumes:
      - ./apps/la-pince-front:/app
      - /app/node_modules

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs/:/etc/nginx/certs:ro
    depends_on:
      - la-pince-backend
      - la-pince-front
      - la-pince-adminer
    networks: [la-pince-net]

volumes:
  pgdata:
  valkey-data:
  mailhog-data:
networks:
  la-pince-net: