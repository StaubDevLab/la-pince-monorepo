user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Essentiel pour la résolution DNS des services Docker
    resolver 127.0.0.11 ipv6=off valid=10s;

    # WebSocket map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- UPSTREAMS (Services internes) ---
    
    upstream la-pince-api {
        zone la_pince_api 64k;
        server la-pince-backend:3333 resolve;
    }

    upstream la-pince {
        zone la_pince 64k;
        server la-pince-front:3000 resolve;
    }
    
    upstream la-pince-adminer {
        zone la_pince_adminer 64k;
        server la-pince-adminer:8080 resolve;
    }

    # --- CERTIFICATS SSL (À adapter si vous utilisez des noms différents) ---
    ssl_certificate     /etc/nginx/certs/la-pince.crt;
    ssl_certificate_key /etc/nginx/certs/la-pince.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;


    # ----------------------------------------------------------------------
    # 1. FRONT-END (la-pince)
    # ----------------------------------------------------------------------

    # HTTP (Port 80) -> Redirection vers HTTPS
    server {
        listen 80;
        server_name la-pince;
        return 301 https://$host$request_uri;
    }

    # HTTPS (Port 443) -> Proxy vers le service Front
    server {
        listen 443 ssl;
        server_name la-pince;

        # Utilisation des certificats définis au niveau HTTP (ou ici si vous préférez)
        ssl_certificate     /etc/nginx/certs/la-pince.crt;
        ssl_certificate_key /etc/nginx/certs/la-pince.key;

        location / {
            proxy_pass http://la-pince;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
        }
    }


    # ----------------------------------------------------------------------
    # 2. BACK-END API (la-pince-api)
    # ----------------------------------------------------------------------

    # HTTP (Port 80) -> Redirection vers HTTPS
    server {
        listen 80;
        server_name la-pince-api;
        return 301 https://$host$request_uri;
    }

    # HTTPS (Port 443) -> Proxy vers le service API
    server {
        listen 443 ssl;
        server_name la-pince-api;

        location / {
            proxy_pass http://la-pince-api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
        }
    }


    # ----------------------------------------------------------------------
    # 3. ADMINER (la-pince-adminer)
    # ----------------------------------------------------------------------

    # HTTP (Port 80) -> Redirection vers HTTPS
    server {
        listen 80;
        server_name la-pince-adminer;
        return 301 https://$host$request_uri;
    }

    # HTTPS (Port 443) -> Proxy vers Adminer
    server {
        listen 443 ssl;
        server_name la-pince-adminer;

        location / {
            proxy_pass http://la-pince-adminer;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

}