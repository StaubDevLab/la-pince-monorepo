user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;


    resolver 127.0.0.11 ipv6=off valid=10s;


    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- UPSTREAMS (Services internes) ---
    
    upstream la-pince-api {
        zone la_pince_api 64k;
        server la-pince-backend:3333 resolve;
    }

    upstream la-pince {
        zone la_pince 64k;
        server la-pince-front:3000 resolve;
    }
    
    upstream la-pince-adminer {
        zone la_pince_adminer 64k;
        server la-pince-adminer:8080 resolve;
    }

    ssl_certificate     /etc/nginx/certs/la-pince.crt;
    ssl_certificate_key /etc/nginx/certs/la-pince.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;



    server {
        listen 80;
        server_name la-pince;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name la-pince;

        ssl_certificate     /etc/nginx/certs/la-pince.crt;
        ssl_certificate_key /etc/nginx/certs/la-pince.key;

        location / {
            proxy_pass http://la-pince;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
        }
    }



    server {
        listen 80;
        server_name la-pince-api;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name la-pince-api;

        location / {
            proxy_pass http://la-pince-api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
        }
    }


    server {
        listen 80;
        server_name la-pince-adminer;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name la-pince-adminer;

        location / {
            proxy_pass http://la-pince-adminer;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

}