version: '3.9'

services:
  la-pince-backend:
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - la-pince-db
      - la-pince-cache
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - la-pince-network

  la-pince-db:
    image: postgres:15
    restart: always
    # ports:
    #   - "5432:5432"
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - la-pince-network

  la-pince-cache:
    image: redis:latest
    restart: always
    # ports:
    #   - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - la-pince-network
    env_file:
      - .env
    command: /bin/sh -c 'redis-server --appendonly yes --requirepass $${CACHE_PASSWORD}'

volumes:
  pgdata:
  redis-data:

networks:
  la-pince-network:
    driver: bridge